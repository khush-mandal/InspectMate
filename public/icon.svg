<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="40" y="40" width="432" height="440" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background with subtle corner radius -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Main Document / Shield Glass Plate -->
  <path d="M140 120 C140 100, 160 80, 256 80 C352 80, 372 100, 372 120 V290 C372 370, 256 420, 256 420 C256 420, 140 370, 140 290 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>
        
  <!-- Scan line beam -->
  <line x1="160" y1="210" x2="352" y2="210" stroke="#4F46E5" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
  <circle cx="256" cy="210" r="4" fill="#4F46E5"/>
  
  <!-- Magnifying Glass Rim -->
  <circle cx="230" cy="240" r="64" stroke="#0F172A" stroke-width="20" fill="none"/>
  
  <!-- Magnifying Handle -->
  <line x1="275" y1="285" x2="330" y2="340" stroke="#0F172A" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Checkmark inside lens -->
  <path d="M205 240 L224 259 L262 221" stroke="#0D9488" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
